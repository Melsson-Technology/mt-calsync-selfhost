# Closes pull requests opened against the GitHub mirror, with an explanation.
#
# A PR cannot be accepted here for two reasons, both stated in the comment below:
#
#   1. This repository is a one-way mirror; the next sync from upstream overwrites anything merged here.
#   2. Contributions are closed until a licence-grant CLA exists (see CONTRIBUTING.md), and relicensing
#      rights cannot be granted retroactively.
#
# Closing at once, with the reason, avoids implying a PR is under consideration.
#
# No third-party actions: `gh` is preinstalled on GitHub-hosted runners, so there is nothing to pin.

name: Pull requests are not open yet

on:
  # pull_request_target, not pull_request: a fork's PR gets a read-only token under `pull_request`
  # and could not be commented on or closed. This job never checks out the PR's code, which is
  # what makes pull_request_target safe here.
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  explain-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<EOF
          Thank you for this, @${AUTHOR} - and sorry to close it automatically.

          **Pull requests are not being accepted yet.** MT-CalSync is AGPL-3.0 and Melsson Technology
          also offers a hosted version, which works only while Melsson holds the rights to relicense
          the codebase. An outside contribution needs a contributor agreement granting those rights
          *before* it is merged, and there is no way to add one afterwards. The agreement is on the
          roadmap; until it exists, merging anything would create a problem that cannot be undone.

          **This repository is also a one-way mirror**, so even a merge here would be overwritten by
          the next sync from upstream - your work would disappear rather than ship.

          Please open an issue instead. Bug reports, "this failed against my tenant", and documentation
          corrections are the most useful thing right now, and they need no paperwork. If you
          would like to make this change yourself once contributions open, say so in the issue and we
          will come back to you.

          None of this restricts what the AGPL already grants you: fork it, modify it, run your own
          version, ship it to others under the same licence. That needs no permission from us.

          See [CONTRIBUTING.md](https://github.com/Melsson-Technology/mt-calsync-selfhost/blob/main/CONTRIBUTING.md).
          EOF
          )"
          gh pr close "$PR_URL"
